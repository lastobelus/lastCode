name: Agent Context Budget

on:
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

# No concurrency group: label events arrive in bursts, and a cancelled run reports as a failed check.
jobs:
  budget:
    name: Agent context budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout proposed merge and its parents
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/lastcode-agent-context-budget
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          allow-increase: ${{ contains(github.event.pull_request.labels.*.name, 'agent-context-increase') }}
