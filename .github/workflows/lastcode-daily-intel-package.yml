name: LastCode daily Intel package

on:
  schedule:
    # 01:00 Pacific during daylight time; midnight during standard time.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: lastcode-daily-intel-package
  cancel-in-progress: false

jobs:
  dispatch:
    name: Ensure newest installable has an Intel package
    runs-on: ubuntu-latest
    # Allow the four-hour build waiter plus setup and registration.
    timeout-minutes: 250
    steps:
      - name: Checkout LastCode automation
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          # The dispatcher needs automation, not the vendored reference files.
          # Tracked gitlinks still require root .gitmodules entries for cleanup.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dispatcher dependencies
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Build or reuse the newest Intel package
        env:
          GH_TOKEN: ${{ github.token }}
          LASTCODE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/lastcode-daily-intel-package.ts
